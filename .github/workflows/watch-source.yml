name: watch-source

# Watches pyquick/AMFIPass without needing a token in that repository. The
# token already stored here is used to read the source commits, and the job
# asks the release workflow to check the version whenever the head changes.
# A self dispatch keeps the loop alive instead of relying on the cron.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [watch]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  # repository_dispatch needs contents write; the self dispatch needs actions.
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Poll pyquick/AMFIPass for a new head
        env:
          PYQUICK_TOKEN: ${{ secrets.PYQUICK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$PYQUICK_TOKEN" ] || { echo "PYQUICK_TOKEN is missing" >&2; exit 1; }
          last=""
          # Five hours, well under the six hour job limit, so the restart step
          # always gets to run. A chain that breaks is picked up by the cron.
          for i in $(seq 1 300); do
            head=$(curl -sS -H "Authorization: Bearer $PYQUICK_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/pyquick/AMFIPass/commits/main |
              python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha",""))' || true)
            if [ -n "$head" ] && [ "$head" != "$last" ]; then
              echo "source head $head (was ${last:-none})"
              last="$head"
              status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/hackdoc/AMFIPASSH/dispatches \
                -d '{"event_type":"source-updated"}')
              echo "dispatch HTTP $status"
              case "$status" in 2*) ;; *) exit 1 ;; esac
            fi
            sleep 60
          done

      - name: Keep the watch alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Three attempts, then let the cron bootstrap take over.
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/hackdoc/AMFIPASSH/actions/workflows/watch-source.yml/dispatches \
              -d '{"ref":"main"}')
            echo "watch restart HTTP $status (attempt $attempt)"
            case "$status" in 2*) exit 0 ;; esac
            sleep 20
          done
          exit 1
